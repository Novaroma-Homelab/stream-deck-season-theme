<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script></head><body><sdpi-item label="Page name"><sdpi-textfield setting="name" placeholder="Home"></sdpi-textfield></sdpi-item><sdpi-item label="Current page"><sdpi-textfield setting="current" placeholder="1" pattern="[0-9]+"></sdpi-textfield></sdpi-item><sdpi-item label="Number of pages (up to 24)"><sdpi-textfield setting="count" placeholder="3" pattern="[0-9]+"></sdpi-textfield></sdpi-item><sdpi-item label="Deck background"><sdpi-select setting="background" global default="plain"><option value="plain">Plain</option><option value="arches">Arches</option><option value="glow">Glow</option><option value="lines">Fine lines</option><option value="dots">Dots</option><option value="wallpaper">Wallpaper (one picture across all keys and the infobar)</option></sdpi-select></sdpi-item><sdpi-item label="Wallpaper style"><sdpi-select setting="wallStyle" global default="scene"><option value="scene">Aqueduct scene with sun or moon</option><option value="waves">Soft waves</option></sdpi-select></sdpi-item><sdpi-item label="Wallpaper switch"><sdpi-select setting="wallTransition" global default="slide"><option value="slide">Slide</option><option value="fade">Fade</option><option value="rise">Rise</option><option value="none">None</option></sdpi-select></sdpi-item></body></html>
