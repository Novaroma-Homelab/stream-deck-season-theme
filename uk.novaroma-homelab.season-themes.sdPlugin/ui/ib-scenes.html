<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script></head><body><sdpi-item label="Transition"><sdpi-select setting="transition" default="slide" required><option value="slide">Slide</option><option value="fade">Fade</option><option value="rise">Rise</option><option value="none">None</option></sdpi-select></sdpi-item><sdpi-item label="Seconds per screen"><sdpi-textfield setting="interval" placeholder="8" pattern="[0-9]+"></sdpi-textfield></sdpi-item><sdpi-item label="Screen: Clock and date"><sdpi-checkbox setting="s_clock" label="Show" default="true"></sdpi-checkbox></sdpi-item><sdpi-item label="Screen: Season progress"><sdpi-checkbox setting="s_season" label="Show" default="true"></sdpi-checkbox></sdpi-item><sdpi-item label="Screen: Moon and year"><sdpi-checkbox setting="s_year" label="Show" default="true"></sdpi-checkbox></sdpi-item><sdpi-item label="Screen: Countdown"><sdpi-checkbox setting="s_countdown" label="Show" default="true"></sdpi-checkbox></sdpi-item><sdpi-item label="Screen: Study timer (only while running)"><sdpi-checkbox setting="s_timer" label="Show" default="true"></sdpi-checkbox></sdpi-item><sdpi-item label="Screen: Home Assistant value"><sdpi-checkbox setting="s_ha" label="Show" default="true"></sdpi-checkbox></sdpi-item><sdpi-item label="Countdown title"><sdpi-textfield setting="label" placeholder="Exam"></sdpi-textfield></sdpi-item><sdpi-item label="Countdown date"><sdpi-textfield setting="date" placeholder="2027-06-30" pattern="\d{4}-\d{2}-\d{2}"></sdpi-textfield></sdpi-item><sdpi-item label="Home Assistant URL"><sdpi-textfield setting="haUrl" global placeholder="http://homeassistant.local:8123" pattern="https?://.+"></sdpi-textfield></sdpi-item><sdpi-item label="Access token"><sdpi-password setting="haToken" global placeholder="Long-lived access token"></sdpi-password></sdpi-item><sdpi-item label="Value entity"><sdpi-textfield setting="entity" placeholder="sensor.living_room_temperature" pattern="([a-z_]+\.[a-z0-9_]+)?"></sdpi-textfield></sdpi-item><sdpi-item label="Value title"><sdpi-textfield setting="haLabel" placeholder="Living room"></sdpi-textfield></sdpi-item><sdpi-item label="Value unit"><sdpi-textfield setting="unit" placeholder="°C"></sdpi-textfield></sdpi-item><sdpi-item label="Deck background"><sdpi-select setting="background" global default="plain"><option value="plain">Plain</option><option value="arches">Arches</option><option value="glow">Glow</option><option value="lines">Fine lines</option><option value="dots">Dots</option><option value="wallpaper">Wallpaper (one picture across all keys and the infobar)</option></sdpi-select></sdpi-item><sdpi-item label="Wallpaper style"><sdpi-select setting="wallStyle" global default="scene"><option value="scene">Aqueduct scene with sun or moon</option><option value="waves">Soft waves</option></sdpi-select></sdpi-item><sdpi-item label="Wallpaper switch"><sdpi-select setting="wallTransition" global default="slide"><option value="slide">Slide</option><option value="fade">Fade</option><option value="rise">Rise</option><option value="none">None</option></sdpi-select></sdpi-item></body></html>
